name = "policyctl-server"
main = "src/index.ts"
compatibility_date = "2024-12-05"
workers_dev = true

# D1 database (created with: wrangler d1 create policyctl)
[[d1_databases]]
binding = "DB"
database_name = "policyctl"
database_id = "ba944db8-7cd8-4082-ba96-6aefddc6f73a"
migrations_dir = "migrations"

# KV cache for parsed policies + session lookups (sub-ms reads)
[[kv_namespaces]]
binding = "POLICYCTL_CACHE"
id = "12ac186b93734a7fa8431dc74ab26ef1"

# Workers AI — edge LLM inference for semantic policy intelligence
[ai]
binding = "AI"

# Durable Objects — live enforcement sessions + streaming dashboard
[durable_objects]
bindings = [
  { name = "POLICY_SESSION", class_name = "PolicySession" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PolicySession"]

# Cron Triggers — daily compliance report at 9am UTC
[triggers]
crons = ["0 9 * * *"]

# ── Turnstile (anti-bot for auth forms) ──
# Public site key — safe to expose. Secret set via: wrangler secret put TURNSTILE_SECRET_SITE
# For local dev, use Cloudflare's test keys (always pass):
#   site:  1x00000000000000000000AA
#   secret: 1x0000000000000000000000000000000AA
[vars]
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
# OAuth redirect URI (must match the Cloudflare Access / Google Cloud OAuth consent screen).
OAUTH_REDIRECT_URI = "https://policyctl-server.shivamkumar10958.workers.dev/api/auth/oauth/callback"
# Structured logs to the Workers Observability platform.
[observability]
enabled = true

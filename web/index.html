<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fa5d19" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo-32.png" />
    <link rel="apple-touch-icon" href="/logo-180.png" />
    <link rel="mask-icon" href="/logo-512.png" color="#fa5d19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="policyctl" />
    <meta
      name="description"
      content="policyctl — provider-agnostic policy runtime for coding agents. One .policyctl.yml, enforced inside Claude Code, Codex, Cursor, and CI. Not just prompt text."
    />
    <title>policyctl — make your coding agents obey the rules</title>
    <script>
      // Prevent FOUC: apply saved theme before React loads. Default = light.
      (function () {
        try {
          var stored = localStorage.getItem("policyctl-theme");
          var theme = (stored === "dark" || stored === "light" || stored === "system") ? stored : "light";
          var resolved = theme;
          if (theme === "system") {
            resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.classList.toggle("dark", resolved === "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

version: 1

# Reusable values; referenced as ${name} inside matcher strings.
vars:
  migrations_dir: db/migrations
  protected: 'README.md|package.json|tsconfig.json'

# Sanctioned exceptions: reviewed bypasses that don't require editing the main policy.
exceptions:
  - rule: migrations-via-generator
    path: 'db/migrations/0000_bootstrap.sql'
    note: initial schema bootstrap, reviewed 2026-08
    enforce: warn
  - rule: no-protected-edits
    path: 'package.json'
    note: Renovate bumps
    enforce: ignore

rules:
  - id: migrations-via-generator
    description: 'DB migrations must be produced by `make migrate`, never handwritten.'
    tags: [db, generative]
    scope: both
    message: 'Migration {{path}} was not generated by the official tool.'
    when:
      all: [{ path: '${migrations_dir}/**' }]
      any: [{ diff_not_contains: '! Generated by make migrate' }]
    enforce: block

  - id: no-protected-edits
    description: 'Agents must not edit protected config files.'
    scope: hook
    when:
      any:
        - { path: 'README.md' }
        - { path: 'package.json' }
        - { path: 'tsconfig.json' }
    enforce: block

  - id: no-secrets-in-commits
    description: 'Reject commits that add obvious secret patterns.'
    tags: [security]
    scope: ci
    when: { diff_regex: '(?i)(aws_secret_access_key|ghp_|sk-[a-z0-9]{20,})' }
    enforce: fail

  - id: tests-for-src
    description: 'Source changes under src/ should be paired with test changes.'
    tags: [quality]
    scope: ci
    when:
      all: [{ diff_paths_glob: 'src/**/*.ts' }]
      any: [{ diff_paths_not_glob: '**/*.test.ts' }]
    enforce: warn

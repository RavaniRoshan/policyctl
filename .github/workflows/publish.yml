name: publish

on:
  push:
    tags: ["v*.*.*"]

jobs:
  publish-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, registry-url: https://registry.npmjs.org }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @policyctl/core build
      - run: pnpm --filter @policyctl/cli build
      - name: Bundle @policyctl/core into the CLI tarball
        run: |
          mkdir -p packages/cli/node_modules/@policyctl/core
          cp -r packages/core/dist/. packages/cli/node_modules/@policyctl/core/
          node -e "const fs=require('fs');const p='packages/cli/node_modules/@policyctl/core/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.files=['dist'];j.main=j.main||'./dist/index.js';j.engines={node:'>=20'};fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
      - name: Switch the workspace dep to a real version
        run: |
          node -e "const fs=require('fs');const p='packages/cli/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.dependencies['@policyctl/core']='^0.1.0';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
      - name: Pack the CLI tarball (for the release asset)
        run: cd packages/cli && npm pack
      - name: Publish to npm
        run: cd packages/cli && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/cli/policyctl-cli-*.tgz
          generate_release_notes: true

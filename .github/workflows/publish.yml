name: publish

on:
  push:
    tags: ["v*.*.*"]

jobs:
  publish-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, registry-url: https://registry.npmjs.org }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @policyctl/core build
      - run: pnpm --filter @policyctl/cli build
      - name: Switch workspace deps to real versions
        run: |
          VERSION=$(node -e "console.log(require('./packages/cli/package.json').version)")
          for pkg in packages/cli packages/core packages/server; do
            node -e "const fs=require('fs');const p='$pkg/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));if(j.dependencies)for(const k of Object.keys(j.dependencies))if(typeof j.dependencies[k]==='string'&&j.dependencies[k].startsWith('workspace:'))j.dependencies[k]='^${VERSION}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          done
          echo "pinned @policyctl/core to ^${VERSION} in cli package.json"
      - name: Publish @policyctl/core
        run: cd packages/core && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @policyctl/cli
        run: cd packages/cli && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Pack the CLI tarball (for the release asset)
        run: cd packages/cli && npm pack --pack-destination .
      - name: Create a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/cli/policyctl-cli-*.tgz
          generate_release_notes: true

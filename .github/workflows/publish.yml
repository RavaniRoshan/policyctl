name: publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  # ── npm: publish @policyctl/core + @policyctl/cli to npmjs.org ───────────────
  publish-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, registry-url: https://registry.npmjs.org }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @policyctl/core build
      - run: pnpm --filter @policyctl/cli build

      - name: Switch workspace deps to real versions
        run: |
          VERSION=$(node -e "console.log(require('./packages/cli/package.json').version)")
          for pkg in packages/cli packages/core packages/server; do
            node -e "const fs=require('fs');const p='$pkg/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));if(j.dependencies)for(const k of Object.keys(j.dependencies))if(typeof j.dependencies[k]==='string'&&j.dependencies[k].startsWith('workspace:'))j.dependencies[k]='^${VERSION}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          done
          echo "pinned @policyctl/core to ^${VERSION} in cli package.json"

      # ── Publish to npmjs.org (primary registry) ─────────────────────────────
      - name: Publish @policyctl/core → npmjs.org
        run: |
          cd packages/core
          VERSION=$(node -e "console.log(require('./package.json').version)")
          if npm view "@policyctl/core@$VERSION" version >/dev/null 2>&1; then
            echo "core@$VERSION already on npm registry — skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @policyctl/cli → npmjs.org
        run: |
          cd packages/cli
          VERSION=$(node -e "console.log(require('./package.json').version)")
          if npm view "@policyctl/cli@$VERSION" version >/dev/null 2>&1; then
            echo "cli@$VERSION already on npm registry — skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Publish to GitHub Packages npm (best-effort) ────────────────────────
      # NOTE: GitHub Packages npm requires @scope to match a GitHub user/org.
      # @policyctl doesn't match owner RavaniRoshan, so this step is best-effort.
      - name: Switch registry to GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@policyctl"

      - name: Add publishConfig for GitHub Packages
        run: |
          for pkg in packages/core packages/cli; do
            node -e "
              const fs = require('fs');
              const p = '$pkg/package.json';
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              j.publishConfig = { registry: 'https://npm.pkg.github.com', access: 'public' };
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            "
          done

      - name: Publish @policyctl/core → GitHub Packages
        continue-on-error: true
        run: cd packages/core && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @policyctl/cli → GitHub Packages
        continue-on-error: true
        run: cd packages/cli && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── GitHub Release with tarball (tag-push only) ──────────────────────────
      - name: Pack the CLI tarball
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          npm config set registry https://registry.npmjs.org
          cd packages/cli && npm pack --pack-destination .

      - name: Create a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/cli/policyctl-cli-*.tgz
          generate_release_notes: true

  # ── docker: publish ghcr.io/ravaniRoshan/policyctl to GitHub Container Registry
  # This makes the package appear in the repo's "Packages" sidebar on GitHub.
  publish-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and lowercase owner
        id: meta
        run: |
          VERSION=$(node -e "console.log(require('./packages/cli/package.json').version)")
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "Building ghcr.io/$OWNER/policyctl:$VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/policyctl:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/policyctl:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=policyctl
            org.opencontainers.image.description=Provider-agnostic policy runtime for coding agents
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.url=https://policyctl-web.pages.dev
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
